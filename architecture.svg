<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="client-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="lb-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="web-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="db-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <linearGradient id="vol-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5" opacity="0.5" />
    </pattern>

    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #f8fafc; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #94a3b8; }
    .node-text { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #ffffff; }
    .sub-text { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #cbd5e1; }
    .badge-text { font-family: system-ui, -apple-system, sans-serif; font-size: 9px; font-weight: 700; fill: #ffffff; }

    /* Keyframe Animations */
    @keyframes flow-fast {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes flow-reverse {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 40; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.03); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    .line-request {
      stroke: #38bdf8;
      stroke-width: 2.5;
      stroke-dasharray: 8 6;
      animation: flow-fast 1.2s linear infinite;
    }
    .line-lb-web {
      stroke: #10b981;
      stroke-width: 2.5;
      stroke-dasharray: 8 6;
      animation: flow-fast 1.5s linear infinite;
    }
    .line-db {
      stroke: #ef4444;
      stroke-width: 2;
      stroke-dasharray: 6 5;
      animation: flow-fast 2s linear infinite;
    }
    .line-vol {
      stroke: #c084fc;
      stroke-width: 2;
      stroke-dasharray: 5 5;
      animation: flow-reverse 2.5s linear infinite;
    }

    .pulse-node {
      animation: pulse 3s ease-in-out infinite;
    }
    .status-dot {
      animation: blink 1.5s ease-in-out infinite;
    }
  </style>

  <!-- Background -->
  <rect width="920" height="520" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="2" />
  <rect width="920" height="520" rx="16" fill="url(#grid)" />

  <!-- Header Banner -->
  <rect x="20" y="20" width="880" height="50" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <circle cx="45" cy="45" r="6" fill="#ef4444" />
  <circle cx="65" cy="45" r="6" fill="#f59e0b" />
  <circle cx="85" cy="45" r="6" fill="#10b981" />
  <text x="110" y="50" class="title">🐳 Enterprise Docker Cluster — Dynamic Load Balancing &amp; Failover Architecture</text>
  <circle cx="875" cy="45" r="5" fill="#10b981" class="status-dot" />

  <!-- Subgraphs / Networks -->
  <!-- Frontend Network Box -->
  <rect x="240" y="90" width="410" height="340" rx="14" fill="#0f172a" fill-opacity="0.6" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="6 4" />
  <rect x="255" y="100" width="160" height="22" rx="4" fill="#0284c7" />
  <text x="263" y="115" class="badge-text">🌐 FRONTEND-NET (Bridge)</text>

  <!-- Backend Network Box -->
  <rect x="670" y="90" width="220" height="340" rx="14" fill="#0f172a" fill-opacity="0.6" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6 4" />
  <rect x="685" y="100" width="170" height="22" rx="4" fill="#ef4444" />
  <text x="693" y="115" class="badge-text">🔒 BACKEND-NET (Internal Isolated)</text>

  <!-- Connecting Lines with Animated Dash -->
  <!-- Client to LB -->
  <path d="M 170 260 L 260 260" class="line-request" />

  <!-- LB to Web Replicas -->
  <path d="M 370 260 C 420 260, 430 145, 470 145" class="line-lb-web" />
  <path d="M 370 260 L 470 260" class="line-lb-web" />
  <path d="M 370 260 C 420 260, 430 375, 470 375" class="line-lb-web" />

  <!-- Replicas to Redis DB -->
  <path d="M 610 145 C 650 145, 670 260, 710 260" class="line-db" />
  <path d="M 610 260 L 710 260" class="line-db" />
  <path d="M 610 375 C 650 375, 670 260, 710 260" class="line-db" />

  <!-- Volume to Replicas -->
  <path d="M 540 450 L 540 405" class="line-vol" />

  <!-- Nodes -->
  <!-- Client Node -->
  <g transform="translate(30, 215)">
    <rect width="140" height="90" rx="12" fill="url(#client-grad)" stroke="#38bdf8" stroke-width="2" filter="url(#glow-cyan)" />
    <text x="70" y="35" text-anchor="middle" class="node-text">💻 Client / User</text>
    <text x="70" y="55" text-anchor="middle" class="sub-text">HTTP Request</text>
    <rect x="25" y="65" width="90" height="18" rx="9" fill="#0369a1" />
    <text x="70" y="77" text-anchor="middle" class="badge-text">PORT 8088</text>
  </g>

  <!-- Nginx Load Balancer -->
  <g transform="translate(260, 205)">
    <rect width="110" height="110" rx="12" fill="url(#lb-grad)" stroke="#34d399" stroke-width="2" filter="url(#glow-green)" />
    <text x="55" y="35" text-anchor="middle" class="node-text">⚖️ Nginx LB</text>
    <text x="55" y="52" text-anchor="middle" class="sub-text">Reverse Proxy</text>
    <rect x="12" y="62" width="86" height="16" rx="8" fill="#065f46" />
    <text x="55" y="74" text-anchor="middle" class="badge-text">least_conn algorithm</text>
    <circle cx="55" cy="94" r="5" fill="#34d399" class="status-dot" />
  </g>

  <!-- Web Replica 1 -->
  <g transform="translate(470, 110)">
    <rect width="140" height="70" rx="10" fill="url(#web-grad)" stroke="#60a5fa" stroke-width="1.5" />
    <text x="70" y="30" text-anchor="middle" class="node-text">🐳 Web Replica 1</text>
    <text x="70" y="48" text-anchor="middle" class="sub-text">Nginx Alpine (CPU: 0.5)</text>
    <circle cx="125" cy="20" r="4" fill="#34d399" class="status-dot" />
  </g>

  <!-- Web Replica 2 -->
  <g transform="translate(470, 225)">
    <rect width="140" height="70" rx="10" fill="url(#web-grad)" stroke="#60a5fa" stroke-width="1.5" />
    <text x="70" y="30" text-anchor="middle" class="node-text">🐳 Web Replica 2</text>
    <text x="70" y="48" text-anchor="middle" class="sub-text">Nginx Alpine (CPU: 0.5)</text>
    <circle cx="125" cy="20" r="4" fill="#34d399" class="status-dot" />
  </g>

  <!-- Web Replica 3 -->
  <g transform="translate(470, 340)">
    <rect width="140" height="70" rx="10" fill="url(#web-grad)" stroke="#60a5fa" stroke-width="1.5" />
    <text x="70" y="30" text-anchor="middle" class="node-text">🐳 Web Replica 3</text>
    <text x="70" y="48" text-anchor="middle" class="sub-text">Nginx Alpine (CPU: 0.5)</text>
    <circle cx="125" cy="20" r="4" fill="#34d399" class="status-dot" />
  </g>

  <!-- Redis Cache DB -->
  <g transform="translate(710, 210)">
    <rect width="140" height="100" rx="12" fill="url(#db-grad)" stroke="#f87171" stroke-width="2" />
    <text x="70" y="35" text-anchor="middle" class="node-text">🗄️ Redis Cache</text>
    <text x="70" y="55" text-anchor="middle" class="sub-text">Session / State DB</text>
    <rect x="15" y="68" width="110" height="18" rx="9" fill="#991b1b" />
    <text x="70" y="80" text-anchor="middle" class="badge-text">NO HOST ACCESS</text>
  </g>

  <!-- Host Volume Mount -->
  <g transform="translate(450, 450)">
    <rect width="180" height="45" rx="8" fill="url(#vol-grad)" stroke="#c084fc" stroke-width="1.5" />
    <text x="90" y="22" text-anchor="middle" class="node-text">💾 Host ./html Volume</text>
    <text x="90" y="37" text-anchor="middle" class="sub-text">Read-Only Live Sync (ro)</text>
  </g>

  <!-- Footer Legend -->
  <g transform="translate(40, 485)">
    <circle cx="10" cy="0" r="5" fill="#38bdf8" />
    <text x="22" y="4" class="sub-text">HTTP Requests</text>
    <circle cx="120" cy="0" r="5" fill="#10b981" />
    <text x="132" y="4" class="sub-text">Load Balanced Traffic</text>
    <circle cx="270" cy="0" r="5" fill="#ef4444" />
    <text x="282" y="4" class="sub-text">Isolated DB Queries</text>
    <circle cx="410" cy="0" r="5" fill="#c084fc" />
    <text x="422" y="4" class="sub-text">Volume Mount</text>
  </g>
</svg>
