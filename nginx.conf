user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    gzip  on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    server {
        listen       80;
        server_name  localhost;

        # Inject container hostname header for Load Balancer identification
        add_header X-Served-By $hostname always;

        # Exact match location for API info endpoint
        location = /api/info {
            access_log off;
            default_type application/json;
            add_header Content-Type application/json always;
            add_header X-Served-By $hostname always;
            return 200 '{"status":"healthy","container_id":"$hostname","server":"Nginx-Alpine"}';
        }

        # Custom health endpoint for healthcheck
        location = /healthz {
            access_log off;
            default_type text/plain;
            add_header Content-Type text/plain always;
            add_header X-Served-By $hostname always;
            return 200 'healthy';
        }

        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        error_page   500 502 503 504  /5x.html;
        location = /5x.html {
            root   /usr/share/nginx/html;
        }
    }
}
