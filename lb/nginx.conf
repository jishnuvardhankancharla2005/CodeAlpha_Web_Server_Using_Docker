user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$upstream_addr"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Upstream definition for Web Server Replicas (Docker DNS resolves 'webserver' to replica IPs)
    upstream web_backends {
        least_conn; # Route requests to backend with fewest active connections
        server webserver:80 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://web_backends;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Pass upstream server response header
            proxy_pass_header X-Served-By;
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
        }

        # Healthcheck endpoint for Load Balancer
        location /lb-healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'load-balancer-healthy';
        }
    }
}
